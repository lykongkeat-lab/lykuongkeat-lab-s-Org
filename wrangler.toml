name = "lykuongkeat-blog"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# Cloudflare Static Assets (Serves built React SPA from dist directory)
[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare R2 Bucket Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "lykuongkeat-media"
preview_bucket_name = "lykuongkeat-media-dev"

# Environment Variables
[vars]
SUPABASE_URL = "https://your-project.supabase.co"
SUPABASE_ANON_KEY = "your-anon-key"
